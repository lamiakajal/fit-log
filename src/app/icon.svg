<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark theme rounded background -->
  <rect width="64" height="64" rx="16" fill="#0f1115"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ccff00" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- FitLog Dumbbell rotated -45deg matching the Logo -->
  <g transform="translate(32, 32) rotate(-45) translate(-32, -32)">
    <!-- Center Bar -->
    <rect x="14" y="29.5" width="36" height="5" rx="2.5" fill="#ccff00"/>
    
    <!-- Left Inner & Outer Plates -->
    <rect x="20" y="20" width="5" height="24" rx="2" fill="#ccff00"/>
    <rect x="12" y="24" width="4" height="16" rx="1.5" fill="#ccff00"/>
    
    <!-- Right Inner & Outer Plates -->
    <rect x="39" y="20" width="5" height="24" rx="2" fill="#ccff00"/>
    <rect x="48" y="24" width="4" height="16" rx="1.5" fill="#ccff00"/>
  </g>
</svg>
